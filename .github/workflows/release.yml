name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: Tag release-please just created.
        required: true
        type: string

permissions:
  contents: read

jobs:
  notes:
    name: Installation notes
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Append the install command to the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          body=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body)
          {
            printf '%s\n\n## Installation\n\n```bash\n' "$body"
            printf 'composer require midsonlajeanty/php-moncash-sdk:"^%s"\n' "${TAG#v}"
            printf '```\n'
          } > "$RUNNER_TEMP/notes.md"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
