name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    env:
      SEMGREP_VERSION: "1.178.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx --python 3.13 "semgrep==${SEMGREP_VERSION}" scan --metrics=off --config p/default --error .

  secrets:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Gitleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "v${GITLEAKS_VERSION}" --repo gitleaks/gitleaks \
            --pattern "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --pattern "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          tar xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'

  dependencies:
    name: Vulnerable dependencies (OSV-Scanner)
    runs-on: ubuntu-latest
    env:
      OSV_SCANNER_VERSION: "2.6.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: "8.5"
          coverage: none
      - run: composer update --no-install --no-scripts --no-plugins --no-progress --no-interaction
      - name: Install OSV-Scanner
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd "$RUNNER_TEMP"
          gh release download "v${OSV_SCANNER_VERSION}" --repo google/osv-scanner \
            --pattern osv-scanner_linux_amd64 --pattern osv-scanner_SHA256SUMS
          sha256sum --check --ignore-missing osv-scanner_SHA256SUMS
          chmod +x osv-scanner_linux_amd64
      - run: '"$RUNNER_TEMP/osv-scanner_linux_amd64" scan source --lockfile composer.lock'

  workflows:
    name: Workflow security (zizmor)
    runs-on: ubuntu-latest
    env:
      ZIZMOR_VERSION: "1.30.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - run: uvx "zizmor==${ZIZMOR_VERSION}" .
        env:
          GH_TOKEN: ${{ github.token }}
